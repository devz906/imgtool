name: IMGTool
options:
  bundleIdPrefix: com.devz906
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  DEVELOPMENT_TEAM: YOUR_TEAM_ID
  CODE_SIGN_STYLE: Automatic
  PRODUCT_BUNDLE_IDENTIFIER: com.devz906.imgtool
  MARKETING_VERSION: 1.0
  CURRENT_PROJECT_VERSION: 1
  CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
  CLANG_CXX_LIBRARY: "libc++"
  SWIFT_OBJC_INTERFACE_HEADER_NAME: "IMGTool-Bridging-Header.h"
  SWIFT_OBJC_BRIDGING_HEADER: "App/IMGTool-Bridging-Header.h"
  CODE_SIGN_ENTITLEMENTS: "App/WinlatoriOS.entitlements"
  ENABLE_BITCODE: NO
  STRIP_INSTALLED_PRODUCT: NO
  DEAD_CODE_STRIPPING: NO
  ONLY_ACTIVE_ARCH: NO

targets:
  IMGTool:
    type: application
    platform: iOS
    sources:
      - path: App
        includes:
          - "**/*.swift"
          - "**/*.h"
          - "**/*.mm"
    resources:
      - path: App/Resources
      - path: Binaries
        includes:
          - "winkor_engine"
    settings:
      INFOPLIST_FILE: App/Info.plist
      PRODUCT_NAME: IMGTool
      SUPPORTED_PLATFORMS: iphoneos
      SUPPORTED_DEVICE_FAMILIES: [1, 2]  # iPhone and iPad
      CODE_SIGN_ENTITLEMENTS: "App/WinlatoriOS.entitlements"
      ENABLE_BITCODE: NO
      STRIP_INSTALLED_PRODUCT: NO
      DEAD_CODE_STRIPPING: NO
      ONLY_ACTIVE_ARCH: NO
      CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
      CLANG_CXX_LIBRARY: "libc++"
      SWIFT_OBJC_INTERFACE_HEADER_NAME: "IMGTool-Bridging-Header.h"
      SWIFT_OBJC_BRIDGING_HEADER: "App/IMGTool-Bridging-Header.h"

schemes:
  IMGTool:
    build:
      targets:
        IMGTool: all
    run:
      config: Debug
    archive:
      config: Release
