- name: Force Ad-Hoc Signing
        run: |
          # Find the entitlements file regardless of where it is
          ENTITLEMENTS_PATH=$(find . -name "*.entitlements" | head -n 1)
          echo "Found entitlements at: $ENTITLEMENTS_PATH"
          
          if [ -z "$ENTITLEMENTS_PATH" ]; then
            echo "❌ Error: Could not find entitlements file!"
            exit 1
          fi

          # Apply the fix to the file we found
          sed -i '' 's/com.apple.developer.team-identifier/$(DevelopmentTeam)/g' "$ENTITLEMENTS_PATH"
