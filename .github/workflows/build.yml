name: Build IMGTool iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Show Xcode and SDK info
      run: |
        xcodebuild -version
        xcodebuild -showsdks
        xcrun --sdk iphoneos --show-sdk-path
        xcrun --find clang
        xcrun --find clang++
        
    - name: Verify Winkor Engine Binary
      run: |
        echo "🔍 Verifying winkor_engine binary..."
        if [ -f "Binaries/winkor_engine" ]; then
          echo "✅ Binary found"
          echo "� Binary info:"
          file Binaries/winkor_engine
          ls -la Binaries/winkor_engine
          echo "🔍 Binary architecture:"
          lipo -info Binaries/winkor_engine
        else
          echo "❌ Binary not found!"
          exit 1
        fi
        
    - name: Install XcodeGen
      run: |
        echo "📦 Installing XcodeGen..."
        brew install xcodegen
        
    - name: Generate Xcode project
      run: |
        echo "⚙️ Generating Xcode project..."
        xcodegen generate
        
    - name: Build IMGTool iOS app
      run: |
        echo "🔨 Building IMGTool iOS app..."
        xcodebuild -project IMGTool.xcodeproj \
                   -scheme IMGTool \
                   -configuration Debug \
                   -destination generic/platform=iOS \
                   -derivedDataPath build \
                   CODE_SIGNING_ALLOWED=NO \
                   clean build
                   
    - name: Upload Winkor Engine Binary
      uses: actions/upload-artifact@v4
      with:
        name: Winkor-Engine
        path: Binaries/winkor_engine
        retention-days: 30
        
    - name: Upload Build Logs
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs
        path: build/
        retention-days: 7
